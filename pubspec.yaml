name: gemorph_flutter
description: A DNA upload application built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # file‐upload, network & PDF generation
  file_picker: ^5.5.0
  http:        ^1.2.0
  simple_gradient_text: 1.3.0
  flutter_spinkit: ^5.2.1
  printing:    ^5.9.1
  pdf:         ^3.8.1    
  path:        ^1.8.3    
  intl:        ^0.18.1
  file_saver: ^0.2.0
  path_provider: ^2.1.1
  provider: ^6.1.2

  # UI Dependencies
  google_fonts: ^5.1.0
  flutter_svg: ^2.2.0
  flutter_cube: ^0.1.0


  # Core
  cupertino_icons: ^1.0.2
  url_launcher: ^6.3.1
  desktop_drop: ^0.6.0
  dotted_border: ^3.1.0
  archive: ^4.0.7
  window_manager: ^0.5.1
  bitsdojo_window: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  http_mock_adapter: ^0.6.1
  mockito: ^5.4.2
  mocktail: ^1.0.1
  build_runner: ^2.4.6

dependency_overrides:
  analyzer: ^6.2.0

flutter:
  uses-material-design: true


  # Assets configuration
  assets:
    - assets/icons/
    - assets/images/

  # Fonts configuration will be handled through google_fonts package

  # You can add custom fonts here if needed
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
  #       - asset: assets/fonts/SpaceGrotesk-Bold.ttf
  #         weight: 700